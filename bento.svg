<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Daniel Muñoz · Multimedia Engineer</title>
  <desc id="d">Ingeniero multimedia: Unity, VR/AR, UI/UX, audio y 3D. Cali, Colombia.</desc>

  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B4A55"/>
      <stop offset="1" stop-color="#06232B"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A3039"/>
      <stop offset="1" stop-color="#06181F"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#00B8D4"/>
      <stop offset="1" stop-color="#2EE6A6"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .name  { font-size: 62px; font-weight: 800; fill: #B8FFF0; }
    .role  { font-size: 26px; font-weight: 600; fill: #2EE6A6; }
    .line  { font-size: 19px; fill: #B8FFF0; opacity: .85; }
    .big   { font-size: 78px; font-weight: 800; fill: #2EE6A6; }
    .label { font-size: 18px; fill: #B8FFF0; opacity: .8; }
    .head  { font-size: 15px; font-weight: 700; fill: #00E5FF; letter-spacing: 2px; }
    .tech  { font-size: 22px; font-weight: 600; fill: #B8FFF0; }
    @keyframes pulse { 0%,100% { transform: scaleY(.45); } 50% { transform: scaleY(1); } }
    .eq rect { fill: url(#bar); transform-box: fill-box; transform-origin: bottom; animation: pulse 1.6s ease-in-out infinite; }
    .eq rect:nth-child(2n) { animation-duration: 1.1s; }
    .eq rect:nth-child(3n) { animation-duration: 2.1s; }
    .eq rect:nth-child(5n) { animation-delay: -.6s; }
  </style>

  <rect width="1200" height="420" rx="28" fill="#02090D"/>

  <!-- Hero tile -->
  <rect x="24" y="24" width="548" height="372" rx="22" fill="url(#hero)" stroke="#00E5FF" stroke-opacity=".55"/>
  <text x="56" y="92" class="head">PORTAFOLIO · 2026</text>
  <text x="56" y="190" class="name">Daniel</text>
  <text x="56" y="256" class="name">Muñoz</text>
  <text x="56" y="306" class="role">Multimedia Engineer</text>
  <text x="56" y="346" class="line">Unity · VR/AR · UI/UX · Audio · 3D</text>
  <text x="56" y="374" class="line" opacity=".6">Cali, Colombia</text>

  <!-- Projects -->
  <rect x="596" y="24" width="270" height="176" rx="22" fill="url(#tile)" stroke="#00E5FF" stroke-opacity=".4"/>
  <text x="624" y="136" class="big">10</text>
  <text x="624" y="168" class="label">proyectos publicados</text>
  <text x="624" y="58" class="head">PROYECTOS</text>

  <!-- English -->
  <rect x="890" y="24" width="286" height="176" rx="22" fill="url(#tile)" stroke="#00E5FF" stroke-opacity=".4"/>
  <text x="918" y="58" class="head">IDIOMAS</text>
  <text x="918" y="136" class="big">C2</text>
  <text x="918" y="168" class="label">Inglés · Español nativo</text>

  <!-- Stack -->
  <rect x="596" y="220" width="270" height="176" rx="22" fill="url(#tile)" stroke="#00E5FF" stroke-opacity=".4"/>
  <text x="624" y="254" class="head">STACK</text>
  <text x="624" y="296" class="tech">C# · Unity</text>
  <text x="624" y="332" class="tech">JavaScript · Node</text>
  <text x="624" y="368" class="tech">Figma · Blender</text>

  <!-- Sound -->
  <rect x="890" y="220" width="286" height="176" rx="22" fill="url(#tile)" stroke="#00E5FF" stroke-opacity=".4"/>
  <text x="918" y="254" class="head">SONIDO</text>
  <g class="eq">
    <rect x="918" y="280" width="12" height="96" rx="6"/>
    <rect x="940" y="280" width="12" height="96" rx="6"/>
    <rect x="962" y="280" width="12" height="96" rx="6"/>
    <rect x="984" y="280" width="12" height="96" rx="6"/>
    <rect x="1006" y="280" width="12" height="96" rx="6"/>
    <rect x="1028" y="280" width="12" height="96" rx="6"/>
    <rect x="1050" y="280" width="12" height="96" rx="6"/>
    <rect x="1072" y="280" width="12" height="96" rx="6"/>
    <rect x="1094" y="280" width="12" height="96" rx="6"/>
    <rect x="1116" y="280" width="12" height="96" rx="6"/>
    <rect x="1138" y="280" width="12" height="96" rx="6"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
